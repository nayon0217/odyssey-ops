name = "odyssey-backend"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Hyperdrive connects the Worker to Postgres.
# On `wrangler dev`, the local Postgres (docker compose) is reached via
# `localConnectionString`. The `id` is a placeholder used only for remote deploys.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "0000000000000000000000000000000000"
localConnectionString = "postgresql://postgres:postgres@localhost:5433/odyssey"

[observability]
enabled = true
